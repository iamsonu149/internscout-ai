[project]
name = "internscout-ai"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.0,<2",
    "beautifulsoup4>=4.13,<5",
    "Flask>=3.1,<4",
    "google-auth>=2.38,<3",
    "requests>=2.32,<3",
    "filelock>=3.17,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
