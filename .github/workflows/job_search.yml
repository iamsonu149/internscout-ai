name: Internship discovery four days weekly
on:
  workflow_dispatch:
  schedule:
    # Monday, Wednesday, Friday, Sunday at 09:00 India Standard Time.
    - cron: '30 3 * * 0,1,3,5'
permissions:
  contents: read
concurrency:
  group: internscout-daily
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB || 'Opportunities' }}
      GOOGLE_REJECTED_SHEET_TAB: ${{ vars.GOOGLE_REJECTED_SHEET_TAB || 'Rejected Matches' }}
      MAX_QUERIES: ${{ vars.MAX_QUERIES || '8' }}
      MAX_SCRAPES: ${{ vars.MAX_SCRAPES || '24' }}
      RESULTS_PER_QUERY: ${{ vars.RESULTS_PER_QUERY || '10' }}
      WEEKLY_CREDIT_LIMIT: '400'
      MAX_RECHECKS: '8'
      MIN_MATCH_SCORE: '80'
      DATABASE_PATH: data/internscout.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Restore discovery history
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: internscout-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: internscout-db-
      - run: python -m pip install -r requirements.txt
      - name: Require restored spending history
        run: python -c "from pathlib import Path; assert Path('data/internscout.db').is_file(), 'Missing spending history; refusing paid discovery. Restore the database cache before retrying.'"
      - name: Require output configuration
        run: python -c "import os; assert os.getenv('GOOGLE_SHEET_ID') and os.getenv('GOOGLE_CREDENTIALS_JSON'), 'Configure Google Sheet and service-account secrets before enabling this workflow'"
      - name: Discover, verify, match and sync
        run: python main.py search
      - name: Save history even after partial failures
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: internscout-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: data/weekly-report.json
          retention-days: 30
